name: daily-snapshot

# local-first-ci contract:
# hosted-only: schedule event semantics and artifact upload transport.
# hosted-confirmation-only: local/subagent matrix must be completed before manual dispatch.
# local-equivalent: uv run python scripts/daily_snapshot.py --dry-run --report-json artifacts/snapshot-report.json
# local-equivalent: uv run python scripts/snapshot_schedule_report.py
# Routine unit/type/import/mutation/frontend/smoke gates stay local/subagent-owned.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  dry-run-schedule-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install dependencies
        run: uv sync
      - name: Snapshot dry-run report
        run: uv run python scripts/daily_snapshot.py --dry-run --report-json artifacts/snapshot-report.json
      - name: Build schedule report and proof
        run: |
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python scripts/snapshot_schedule_report.py \
            artifacts/snapshot-report.json \
            --out-dir artifacts \
            --proof-json artifacts/snapshot-schedule-run-proof.json \
            --workflow daily-snapshot \
            --trigger "${{ github.event_name }}" \
            --command "uv run python scripts/daily_snapshot.py --dry-run --report-json artifacts/snapshot-report.json" \
            --exit-code 0 \
            --started-at "$STARTED_AT" \
            --finished-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: snapshot-schedule-proof
          path: artifacts/*.json
