[project]
name = "invest-algorithms"
version = "0.1.0"
description = "Investment pyramid (arithmetic/geometric) algorithms API"
authors = [{ name = "YuehChengChang", email = "ycchang.pmp@gmail.com" }]
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "joblib>=1.5.3",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "statsmodels>=0.14.6",
    "torch>=2.12.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "jupyterlab>=4.4",
    "datamodel-code-generator>=0.61.0",
    "hypothesis>=6.155.2",
    "mypy>=2.1.0",
    "mutmut>=3.6.0",
    "import-linter>=2.11",
]

# Application project (not a distributable package): uv manages the
# virtualenv but does not build/install the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# repo root on import path so top-level `import quantlab` resolves at collection time
pythonpath = ["."]

[tool.mypy]
# 既有 legacy 金字塔模組未加型別;adapter 只呼叫不改它 → mypy 忽略其錯誤
[[tool.mypy.overrides]]
module = "invest_algorithms.*"
ignore_errors = true

[tool.importlinter]
root_package = "quantlab"
include_external_packages = true

[[tool.importlinter.contracts]]
# 框架隔離鐵律(NFR-A0-FWAGN-001):回測核心不得依賴任何 ML 框架
name = "Backtest core (engine/data) is framework-agnostic"
type = "forbidden"
source_modules = ["quantlab.engine", "quantlab.data"]
forbidden_modules = ["torch", "tensorflow", "jax", "flax"]

[tool.mutmut]
# 對方法論核心(成本/指標/walk-forward/PIT 取數)做 mutation testing
paths_to_mutate = [
    "quantlab/costs/model.py",
    "quantlab/engine/metrics.py",
    "quantlab/engine/walkforward.py",
    "quantlab/data/provider.py",
]
tests_dir = ["tests/"]
